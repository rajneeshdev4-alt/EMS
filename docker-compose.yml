version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ems-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:5173
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:5000/api/v1
    container_name: ems-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped